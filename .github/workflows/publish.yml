name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version from commit count
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "0.0.${COUNT}" > version.txt
          sed -i "s/__version__ = .*/__version__ = \"0.0.${COUNT}\"/" src/workerz/__init__.py

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
